name: Build

on:
  push:
    branches: [main]
    paths:
      - 'CatVox/**'
      - 'CatVoxTests/**'
      - 'CatVoxUITests/**'
      - 'CatVox.xcodeproj/**'
      - 'config/environments/**'
      - 'scripts/**'
      - 'Makefile'
      - 'project.yml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CatVox/**'
      - 'CatVoxTests/**'
      - 'CatVoxUITests/**'
      - 'CatVox.xcodeproj/**'
      - 'config/environments/**'
      - 'scripts/**'
      - 'Makefile'
      - 'project.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Cancel any in-progress run for the same branch so each push doesn't queue
# behind the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict the default GITHUB_TOKEN to least privilege. Both jobs only check
# out the repo and run the build/test toolchain — no write scopes required.
permissions:
  contents: read

# Pinned iOS toolchain, shared by both jobs. Bump these on purpose, never by
# drift:
# - DEVELOPER_DIR selects one Xcode installed on the runner image. Every
#   xcodebuild/xcrun call fails loudly if the image no longer ships it.
# - XcodeGen comes from its GitHub release, checked against a SHA-256, so CI
#   renders the same project as a local `make ios-generate` with that version.
# - The Makefile's default simulator ("iPhone 16") is not on this image. The
#   Makefile sets IOS_*_DESTINATION with `:=`, which an environment variable
#   cannot override, so the steps below pass it on the make command line.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  XCPRETTY_VERSION: 0.4.1
  IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5

jobs:
  build:
    name: Build — iOS Simulator
    runs-on: macos-26          # Apple silicon; Xcode pinned by DEVELOPER_DIR

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── Toolchain ───────────────────────────────────────────────────────
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --silent --show-error --location --retry 3 --output "$zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${zip}" | shasum -a 256 --check
          unzip -q "$zip" -d "$RUNNER_TEMP"
          version="$("$RUNNER_TEMP/xcodegen/bin/xcodegen" --version)"
          echo "$version"
          if [ "$version" != "Version: ${XCODEGEN_VERSION}" ]; then
            echo "::error::Expected XcodeGen ${XCODEGEN_VERSION}, got: ${version}"
            exit 1
          fi
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Install xcpretty
        run: gem install xcpretty --version "$XCPRETTY_VERSION" --no-document --quiet

      # ── Project generation ───────────────────────────────────────────────
      - name: Generate Xcode project
        run: make ios-generate

      # CI builds from a fresh generation, so a stale committed project would
      # only break local Xcode and archive builds (e.g. a missing resource).
      # Check the whole tree, not just `git diff`: untracked files (a new
      # scheme) and outputs outside the .xcodeproj (CatVox/Info.plist) count.
      - name: Check generated project is committed
        run: |
          drift="$(git status --porcelain --untracked-files=all)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git --no-pager diff
            echo "::error title=Generated project drift::The committed XcodeGen output does not match project.yml. Run 'make ios-generate' with XcodeGen ${XCODEGEN_VERSION} and commit the result."
            exit 1
          fi

      - name: Validate Firebase Environment Config
        run: |
          node --version
          make ios-validate-env-config

      - name: Validate Prod Environment Structure
        run: make ios-validate-env-config-structure CATVOX_ENVIRONMENT=prod

      - name: Validate Prod Firebase Config
        run: make ios-validate-env-config CATVOX_ENVIRONMENT=prod

      - name: Validate Release Safety (protected environment)
        run: make ios-validate-release-safety CATVOX_ENVIRONMENT=prod

      - name: Guard Analytics Capture Boundary
        run: make ios-analytics-guard

      # ── Build ────────────────────────────────────────────────────────────
      # Targets the generic simulator slice — no device signing required.
      - name: Build for iOS Simulator
        timeout-minutes: 15
        env:
          CATVOX_SKIP_XCODE_FIREBASE_CONFIG_VALIDATION: '1'
        run: make ios-build-only

      - name: Run iOS Unit Tests
        env:
          CATVOX_SKIP_XCODE_FIREBASE_CONFIG_VALIDATION: '1'
        run: make ios-test-only IOS_TEST_DESTINATION="$IOS_SIMULATOR_DESTINATION"

      # SwiftPM must build the versions pinned in the committed Package.resolved.
      # If project.yml's package requirements changed without a matching
      # Package.resolved, xcodebuild re-resolved and rewrote it above.
      - name: Check Package.resolved is committed
        run: |
          if ! git diff --exit-code -- CatVox.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "::error title=Package.resolved drift::xcodebuild re-resolved Swift packages. Resolve them locally (make ios-build) after the project.yml change and commit Package.resolved."
            exit 1
          fi

  ui-tests:
    name: UI Tests — iOS Simulator
    runs-on: macos-26
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --silent --show-error --location --retry 3 --output "$zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${zip}" | shasum -a 256 --check
          unzip -q "$zip" -d "$RUNNER_TEMP"
          version="$("$RUNNER_TEMP/xcodegen/bin/xcodegen" --version)"
          echo "$version"
          if [ "$version" != "Version: ${XCODEGEN_VERSION}" ]; then
            echo "::error::Expected XcodeGen ${XCODEGEN_VERSION}, got: ${version}"
            exit 1
          fi
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Install xcpretty
        run: gem install xcpretty --version "$XCPRETTY_VERSION" --no-document --quiet

      - name: Run iOS UI Tests
        env:
          CATVOX_SKIP_XCODE_FIREBASE_CONFIG_VALIDATION: '1'
        run: make ios-ui-test IOS_UI_TEST_DESTINATION="$IOS_SIMULATOR_DESTINATION"
